name: Read-only Timeline MCP
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install isolated service and test dependencies
        run: python -m pip install -r requirements-timeline-mcp.txt pytest flake8
      - name: Lint new service and tests
        run: python -m flake8 timeline_mcp.py tests/test_timeline_mcp*.py
      - name: Compile and run crypto, isolation and real MCP HTTP tests
        run: |
          set -o pipefail
          mkdir -p mcp-test-evidence
          python -m compileall -q timeline_mcp.py
          python -m pytest tests/test_timeline_mcp.py tests/test_timeline_mcp_http.py tests/test_timeline_mcp_schema.py -v --junitxml=mcp-test-evidence/junit.xml 2>&1 | tee mcp-test-evidence/pytest.txt
      - name: Build isolated container
        run: docker build -f Dockerfile.timeline-mcp -t myxstack-timeline-mcp:test .
      - name: Verify container refuses empty configuration
        run: |
          if docker run --rm myxstack-timeline-mcp:test > mcp-test-evidence/empty-config.txt 2>&1; then
            echo "ERROR: unconfigured service unexpectedly started"
            exit 1
          fi
          grep -q "TIMELINE_MCP_ISSUER_URL is required" mcp-test-evidence/empty-config.txt
      - name: Record exact source and environment
        if: always()
        run: |
          mkdir -p mcp-test-evidence
          git rev-parse HEAD > mcp-test-evidence/commit.txt
          sha256sum timeline_mcp.py tests/test_timeline_mcp*.py > mcp-test-evidence/source-sha256.txt
          python -m pip freeze > mcp-test-evidence/dependencies.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: timeline-mcp-evidence
          path: mcp-test-evidence/
