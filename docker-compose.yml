services:
  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=xmcp
      - POSTGRES_USER=xmcp
      - POSTGRES_HOST_AUTH_METHOD=trust
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xmcp -d xmcp"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  mcp-server:
    build: .
    command: python server.py
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      - MCP_HOST=0.0.0.0
      - MCP_PORT=8000
      - DATABASE_URL=postgresql://xmcp@postgres:5432/xmcp
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  timeline-server:
    build: .
    command: python timeline_server.py
    ports:
      - "8080:8080"
    env_file: .env
    environment:
      - TIMELINE_HOST=0.0.0.0
      - TIMELINE_PORT=8080
      - DATABASE_URL=postgresql://xmcp@postgres:5432/xmcp
    volumes:
      - xmcp-data:/root/.xmcp
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  listener:
    build: .
    command: python listener.py
    env_file: .env
    environment:
      - MCP_SERVER_URL=http://mcp-server:8000/mcp
      - TIMELINE_API_URL=http://timeline-server:8080
      - DATABASE_URL=postgresql://xmcp@postgres:5432/xmcp
    volumes:
      - xmcp-data:/root/.xmcp
    depends_on:
      timeline-server:
        condition: service_healthy
      mcp-server:
        condition: service_started
      postgres:
        condition: service_healthy
    restart: unless-stopped

  mcp-dispatcher:
    build: .
    command: python mcp_dispatcher.py
    env_file: .env
    environment:
      - MCP_SERVER_URL=http://mcp-server:8000/mcp
      - TIMELINE_API_URL=http://timeline-server:8080
      - DATABASE_URL=postgresql://xmcp@postgres:5432/xmcp
    volumes:
      - xmcp-data:/root/.xmcp
    depends_on:
      timeline-server:
        condition: service_healthy
      mcp-server:
        condition: service_started
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  xmcp-data:
